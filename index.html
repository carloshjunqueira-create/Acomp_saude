${forca?`<div class="card"><h3>Fase ${f.n} — ${f.rir}</h3>${lista}<label class="check"><input type="checkbox" id="progOk" ${rascunho.progressaoOk?'checked':''}><span><b>Técnica e RIR confirmados.</b> Marque só se, nas séries de trabalho, a execução permaneceu boa e você respeitou a reserva da fase. Sem esta confirmação o painel nunca libera aumento de carga.</span></label></div>`:''}

function viewMedidas(){const u=S.medidas[S.medidas.length-1]||{};return `<div class="btnrow" style="margin:0 0 8px"><button class="btn sec mini" data-modo="treino" style="flex:1">Treino</button><button class="btn sec mini" data-modo="medidas" style="flex:1;border-color:var(--gold);color:var(--gold2)">Medidas do corpo</button></div><div class="card"><h3>Medidas</h3><small>Use condições semelhantes a cada medição. Não tire conclusão de um único ponto.</small><label class="f">Data</label><input class="t" type="date" id="mData" value="${hoje()}"><div class="dois"><div><label class="f">Peso (kg)</label><input class="t" inputmode="decimal" id="mPeso" placeholder="${u.peso??'—'}"></div><div><label class="f">Cintura (cm)</label><input class="t" inputmode="decimal" id="mCintura" placeholder="${u.cintura??'—'}"></div></div><div class="dois"><div><label class="f">Braço (cm)</label><input class="t" inputmode="decimal" id="mBraco" placeholder="${u.braco??'—'}"></div><div><label class="f">Coxa (cm)</label><input class="t" inputmode="decimal" id="mCoxa" placeholder="${u.coxa??'—'}"></div></div><div class="tres"><div><label class="f">FC repouso</label><input class="t" inputmode="numeric" id="mFc" placeholder="${u.fcRep??'—'}"></div><div><label class="f">VO₂ máx</label><input class="t" inputmode="decimal" id="mVo2" placeholder="${u.vo2??'—'}"></div><div><label class="f">Sono médio (h)</label><input class="t" inputmode="decimal" id="mSono" placeholder="${u.sono??'—'}"></div></div><button class="btn" id="salvarMed" ${STORE.persistent?'':'disabled'} style="margin-top:14px">Salvar medidas</button></div>${S.medidas.length?`<div class="card"><h3>Últimas medidas</h3><table><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>VO₂</th></tr>${S.medidas.slice(-6).reverse().map(m=>`<tr><td>${m.data.slice(8)}/${m.data.slice(5,7)}</td><td>${m.peso??'—'}</td><td>${m.cintura??'—'}</td><td>${m.vo2??'—'}</td></tr>`).join('')}</table></div>`:''}`}
function viewProgresso(){if(!S.sessoes.length&&!S.medidas.length)return '<div class="card"><h3>Ainda vazio</h3><p style="color:var(--muted)">Registre a primeira sessão. Gráficos de tendência aparecem a partir do segundo ponto.</p><button class="btn" data-go="registrar">Registrar</button></div>';const semanas={};validas().forEach(s=>{const k=segunda(s.data);semanas[k]=(semanas[k]||0)+1});const keys=Object.keys(semanas).sort().slice(-8),bars=keys.map(k=>({x:k.slice(8)+'/'+k.slice(5,7),y:semanas[k],destaque:k===segunda(hoje())}));const setSem={};validas().filter(s=>isForca(s.tipo)).forEach(s=>{const k=segunda(s.data);setSem[k]=(setSem[k]||0)+(s.exercicios||[]).reduce((t,e)=>t+seriesCompletas(e.id,e.series).length,0)});const ptsSet=Object.keys(setSem).sort().slice(-10).map(k=>({x:k.slice(8)+'/'+k.slice(5,7),y:setSem[k]}));const ptsPeso=S.medidas.filter(m=>m.peso>0).map(m=>({x:m.data.slice(8)+'/'+m.data.slice(5,7),y:m.peso})),ptsC=S.medidas.filter(m=>m.cintura>0).map(m=>({x:m.data.slice(8)+'/'+m.data.slice(5,7),y:m.cintura})),ptsV=S.medidas.filter(m=>m.vo2>0).map(m=>({x:m.data.slice(8)+'/'+m.data.slice(5,7),y:m.vo2}));const forcaCards=['legpress','supino','puxada','rdl'].map(id=>{const pts=[];validas().forEach(s=>{const e=(s.exercicios||[]).find(e=>e.id===id);const cs=e?seriesCompletas(id,e.series):[];if(!cs.length||EX[id].semCarga)return;const m=Math.max(...cs.filter(x=>x.reps<=15).map(x=>e1rm(x.kg,x.reps)).filter(Number.isFinite));if(m>0)pts.push({x:s.data.slice(8)+'/'+s.data.slice(5,7),y:Math.round(m*10)/10})});return pts.length>1?`<div class="graf"><h3>${EX[id].n}<em>força estimada na unidade registrada</em></h3>${grafLinha(pts)}</div>`:''}).join('');const eventos=S.sessoes.slice(-8).reverse();return `<div class="linha"><div class="kpi"><div class="n">${nSeriesSemana()}</div><div class="l">séries de força nesta semana</div></div><div class="kpi"><div class="n">${cardioSemana()}</div><div class="l">min de cardio nesta semana</div></div><div class="kpi"><div class="n">${nForcaEstruturada()}</div><div class="l">força A/B acumulada</div><div class="d flat">fase ${faseAtual().n}</div></div></div><div class="graf"><h3>Sessões válidas por semana<em>meta base: 4</em></h3>${grafBarras(bars,{meta:4})}</div><div class="graf"><h3>Séries de força por semana<em>volume menos enganoso que tonelagem total</em></h3>${grafLinha(ptsSet,{cor:'var(--blue)'})}</div>${ptsPeso.length>1?`<div class="graf"><h3>Peso<em>tendência</em></h3>${grafLinha(ptsPeso,{cor:'var(--blue)'})}</div>`:''}${ptsC.length>1?`<div class="graf"><h3>Cintura<em>tendência</em></h3>${grafLinha(ptsC,{cor:'var(--blue)'})}</div>`:''}${ptsV.length>1?`<div class="graf"><h3>VO₂ máx<em>tendência cardiovascular</em></h3>${grafLinha(ptsV,{cor:'var(--green)'})}</div>`:''}${forcaCards}<h2>Últimos registros</h2><div class="tl">${eventos.map(s=>`<div class="tl-item"><div class="tl-d">${s.data.slice(8)}/${s.data.slice(5,7)}</div><div class="tl-t">${TREINOS[s.tipo].nome} · ${s.nivel==='P'?'parcial':'nível '+s.nivel}</div></div>`).join('')}</div>`}
function viewPlano(){const f=faseAtual();return `<div class="card"><h3>Objetivo operacional</h3><p style="font-size:13.5px;color:var(--muted);margin:0">Construir consistência, força e capacidade aeróbica com um protocolo que resista a semanas ruins. O painel não substitui orientação médica ou avaliação presencial quando houver dor, sintomas ou restrições clínicas.</p></div><h2>Fases</h2>${FASES.map(x=>`<div class="bloco ${x.n===f.n?'ativo':''}"><h3>Fase ${x.n} — ${x.nome} ${x.n===f.n?'<span class="tag f">atual</span>':''}</h3><small>${x.faixa} · ${x.rir}</small><p style="font-size:13.5px;margin:6px 0">${x.o}</p><ul class="lim" style="font-size:13.5px;color:var(--muted)">${x.d.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}<h2>Fila de 8 sessões</h2><div class="card"><p style="font-size:13.5px">Faça a próxima da fila no dia em que puder. Sessões extras são registradas, mas só a sessão esperada avança a fila.</p><div>${FILA.map((t,i)=>`<span class="tag ${TREINOS[t].cor}"${i===posFila()%FILA.length?' style="border-color:var(--gold);color:var(--gold2)"':''}>${i+1}. ${t}${i===posFila()%FILA.length?' ←':''}</span>`).join('')}</div><small>Sequência: FA · Z2 · FB · MOB · FA · Z2 · FB · INT. Antes de 4 treinos de força A/B, o slot INT vira Z2 automaticamente. A meta base de uma semana típica é 4 sessões, com pelo menos 2 de força.</small></div>${Object.entries(TREINOS).filter(([,v])=>v.ex.length).map(([k,t])=>`<details class="acc"><summary>${t.nome}</summary><div class="corpo"><table><tr><th>Exercício</th><th>Séries por fase</th><th>Reps</th></tr>${t.ex.map(id=>`<tr><td><b>${EX[id].n}</b><br><small>${EX[id].nota}</small></td><td>${EX[id].s.join(' / ')}</td><td>${EX[id].reps}</td></tr>`).join('')}</table><small>B = 2 séries nos 3 principais. C = 1 série nos 3 principais. A progressão de carga só é validada em A.</small></div></details>`).join('')}<details class="acc"><summary>Regra de progressão de carga</summary><div class="corpo"><ol class="lim"><li>Escolha uma carga que permita ficar dentro da faixa de reps com o RIR da fase.</li><li>Nas sessões seguintes, mantenha a carga e tente somar repetições sem perder técnica.</li><li>Somente quando uma sessão <b>A</b> atingir o topo da faixa em todas as séries previstas e você marcar “técnica e RIR confirmados”, aumente a carga no próximo A.</li><li>Depois do aumento, volte para perto do piso da faixa.</li><li>B/C nunca obrigam aumento de carga.</li></ol></div></details><details class="acc"><summary>Cardio</summary><div class="corpo"><p><b>Zona 2:</b> use a Zona 2 personalizada do Apple Watch como ponto de partida e confirme pelo teste da fala. Fase 1: 25–30 min; fase 2: 35–45; fase 3: 40–50, com um treino opcional mais longo se recuperação estiver boa.</p><p><b>Intervalado:</b> só entra na fila depois de 4 treinos de força A/B. Priorize qualidade e recuperação; não use para “compensar” treino perdido.</p><p><b>Ordem no mesmo dia:</b> se força e cardio forem combinados, faça força primeiro quando a prioridade for preservar desempenho na musculação.</p></div></details><div class="aviso"><b>Reavaliação:</b> ao chegar a 32 treinos de força A/B, trate este bloco como concluído e reavalie cargas, exercícios, frequência e objetivos antes de simplesmente continuar aumentando volume.</div>`}
function resumoTexto(){const l=[];l.push('PAINEL — '+PERFIL.nome+' — '+hoje());l.push('Sessões válidas: '+validas().length+' · parciais: '+S.sessoes.filter(s=>s.nivel==='P').length+' · força A/B: '+nForcaEstruturada()+' · fase '+faseAtual().n+' · corrente '+corrente()+' dias');l.push('');l.push('SESSÕES (data | tipo | nível | cardio | exercícios)');S.sessoes.slice(-30).forEach(s=>{const ex=(s.exercicios||[]).map(e=>EX[e.id].n.split(' (')[0]+' '+seriesCompletas(e.id,e.series).map(x=>(EX[e.id].semCarga?'':fmt(x.kg)+'x')+fmt(x.reps)).join(',')).filter(x=>!x.endsWith(' '));l.push(`${s.data} | ${s.tipo} | ${s.nivel} | ${num(s.cardio&&s.cardio.min)||0} min${ex.length?' | '+ex.join(' ; '):''}${s.notas?' | nota: '+s.notas:''}`)});l.push('');l.push('MEDIDAS');S.medidas.slice(-20).forEach(m=>l.push([m.data,m.peso,m.cintura,m.braco,m.coxa,m.fcRep,m.vo2,m.sono].map(v=>v??'-').join(' | ')));return l.join('\n')}
function viewDados(){return `<div class="card"><h3>Armazenamento</h3><p style="font-size:13.5px;color:var(--muted)"><b>${storageText()}.</b> Backup continua obrigatório antes de trocar de endereço/versão ou limpar o Safari.</p></div><div class="card"><h3>Enviar progresso</h3><button class="btn" id="copiaResumo">Copiar resumo</button></div><div class="card"><h3>Backup e migração</h3><p style="font-size:13.5px;color:var(--muted)">O v3 importa backups do v2 e v1. Registros antigos incompletos são reclassificados como parciais e não entram na progressão.</p><div class="btnrow"><button class="btn sec" id="copiaBackup">Copiar backup</button><button class="btn sec" id="baixaBackup">Baixar .json</button></div><button class="btn sec" id="importar" style="margin-top:8px">${mostrarImport?'Cancelar':'Importar backup'}</button>${mostrarImport?`<div style="margin-top:10px"><textarea class="t" id="areaImport" placeholder="Cole o JSON do backup" style="min-height:120px">${esc(textoImport)}</textarea><button class="btn" id="aplicaImport" style="margin-top:8px">${confirmar==='import'?'Confirmar substituição':'Substituir pelos dados do backup'}</button><button class="btn sec" id="fundeImport" style="margin-top:8px">Mesclar sem duplicar</button></div>`:''}</div>${S.sessoes.length||S.medidas.length?`<div class="card"><h3>Histórico e limpeza</h3><small>Registros parciais ficam visíveis, mas não movem nenhuma métrica de aderência.</small>${S.sessoes.slice().reverse().map((s,i)=>{const idx=S.sessoes.length-1-i;return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0"><div style="font-size:13.5px">${s.data.slice(8)}/${s.data.slice(5,7)} · <b>${s.tipo}</b> · ${s.nivel==='P'?'parcial':'nível '+s.nivel}</div>${confirmar==='ses:'+idx?`<div class="btnrow" style="margin:0"><button class="btn mini" data-delses="${idx}" style="background:var(--red)">Confirmar</button><button class="btn sec mini" data-cancelar="1">Não</button></div>`:`<button class="btn sec mini" data-delses="${idx}" style="color:var(--red)">Apagar</button>`}</div>`}).join('')}${S.medidas.slice().reverse().map((m,i)=>{const idx=S.medidas.length-1-i;return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0"><div style="font-size:13.5px">${m.data.slice(8)}/${m.data.slice(5,7)} · medidas${m.peso?' · '+fmt(m.peso)+' kg':''}</div>${confirmar==='med:'+idx?`<div class="btnrow" style="margin:0"><button class="btn mini" data-delmed="${idx}" style="background:var(--red)">Confirmar</button><button class="btn sec mini" data-cancelar="1">Não</button></div>`:`<button class="btn sec mini" data-delmed="${idx}" style="color:var(--red)">Apagar</button>`}</div>`}).join('')}${confirmar==='tudo'?`<div class="aviso erro">Isto apaga tudo neste armazenamento.</div><button class="btn" id="apagarTudo" style="background:var(--red)">Confirmar zerar painel</button><button class="btn sec" data-cancelar="1" style="margin-top:8px">Cancelar</button>`:`<button class="btn sec" id="apagarTudo" style="margin-top:14px;color:var(--red)">Zerar todos os dados</button>`}</div>`:''}<div class="card"><h3>Apple Health — rotina simples</h3><ol class="lim" style="font-size:13.5px;color:var(--muted)"><li>Use o Apple Watch normalmente nos treinos.</li><li>Uma vez por semana, exporte do Health Auto Export apenas as métricas que você realmente analisa e os treinos.</li><li>Anexe o arquivo junto com “Copiar resumo”.</li><li>MCP remoto é opcional e fica fora do uso diário: só configure se aceitar armazenar dados de saúde em um backend remoto e depois de revisar segurança e compatibilidade.</li></ol></div>`}
function render(scroll=false){$('#dataHoje').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});const st=$('#storageStatus');st.textContent=storageText();st.className='storage '+(STORE.persistent?'ok':'bad');const v={hoje:viewHoje,registrar:viewRegistrar,progresso:viewProgresso,plano:viewPlano,dados:viewDados}[aba];$('#app').innerHTML=v();document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===aba));if(scroll)window.scrollTo(0,0)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;aba=b.dataset.t;confirmar=null;confirmarTipo=null;if(aba!=='registrar')modoReg='treino';render(true)});
document.addEventListener('click',async e=>{const t=e.target,go=t.closest('[data-go]');if(go){aba=go.dataset.go;if(go.dataset.tipo){modoReg='treino';rascunho=novoRascunho(go.dataset.tipo);salvarDraft(true)}render(true);return}const modo=t.closest('[data-modo]');if(modo){modoReg=modo.dataset.modo;render();return}const tp=t.closest('[data-tipo]');if(tp&&aba==='registrar'){const k=tp.dataset.tipo;if(k!==rascunho.tipo&&rascunhoTemDados()&&confirmarTipo!==k){confirmarTipo=k;toast('Toque novamente para trocar o tipo e descartar este rascunho');return}rascunho=novoRascunho(k);confirmarTipo=null;salvarDraft(true);render();return}const nv=t.closest('[data-nivel]');if(nv&&rascunho){rascunho.nivel=nv.dataset.nivel;salvarDraft();render();return}const add=t.closest('[data-add]');if(add){const d=rascunho.exercicios.find(x=>x.id===add.dataset.add),u=d.series[d.series.length-1]||{};d.series.push({kg:u.kg||'',reps:''});salvarDraft();render();return}const rm=t.closest('[data-rm]');if(rm){const d=rascunho.exercicios.find(x=>x.id===rm.dataset.rm),i=+rm.dataset.ri;if(d&&i>=0&&i<d.series.length){d.series.splice(i,1);salvarDraft();render()}return}
if(t.id==='salvarSes'){if(salvandoSessao)return;if(!STORE.persistent){toast('Abra a versão com armazenamento persistente antes de registrar');return}const err=validarRascunho();if(err){toast(err);return}const s=sanitizeRascunho();const temAlgo=s.exercicios.length||(num(s.cardio.min)||0)>0||s.notas;if(!temAlgo){toast('Nada concluído para salvar');return}const dup=S.sessoes.some(x=>x.data===s.data&&x.tipo===s.tipo&&x.nivel!=='P');const dk='dup:'+s.data+':'+s.tipo;if(dup&&confirmar!==dk){confirmar=dk;toast('Já existe '+s.tipo+' nesta data. Toque Salvar novamente se for uma segunda sessão real.');return}confirmar=null;salvandoSessao=true;const before=JSON.stringify(S);S.sessoes.push(s);S.sessoes.sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||'').localeCompare(b.criadoEm||''));const ok=await persistir();salvandoSessao=false;if(!ok){S=normalizeState(JSON.parse(before));toast('Falha ao gravar. Rascunho mantido; faça um backup e tente novamente.');return}rascunho=null;draftRecuperado=false;limparDraft();aba='hoje';render(true);toast(s.nivel==='P'?'Registro parcial salvo — fila não avançou':`Sessão ${s.nivel} salva`);return}
if(t.id==='salvarMed'){const data=$('#mData').value||hoje();if(!dateObj(data)||data>hoje()){toast('Data inválida');return}const g=id=>num($('#'+id).value);const m={id:uid('m'),data,peso:g('mPeso'),cintura:g('mCintura'),braco:g('mBraco'),coxa:g('mCoxa'),fcRep:g('mFc'),vo2:g('mVo2'),sono:g('mSono')};const vals=['peso','cintura','braco','coxa','fcRep','vo2','sono'].map(k=>m[k]).filter(v=>v!==null);if(!vals.length){toast('Preencha ao menos um campo');return}if(vals.some(v=>v<0)){toast('Medidas não podem ser negativas');return}const before=JSON.stringify(S),ix=S.medidas.findIndex(x=>x.data===data);if(ix>=0){const base=S.medidas[ix];for(const k of ['peso','cintura','braco','coxa','fcRep','vo2','sono'])if(m[k]!==null)base[k]=m[k]}else S.medidas.push(m);S.medidas.sort((a,b)=>a.data.localeCompare(b.data));if(!await persistir()){S=normalizeState(JSON.parse(before));render();toast('Falha ao gravar medidas');return}render();toast(ix>=0?'Medidas do dia atualizadas':'Medidas salvas');return}
if(t.id==='copiaResumo'||t.id==='copiaBackup'){const txt=t.id==='copiaResumo'?resumoTexto():JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast('Copiado')}catch(err){const ta=document.createElement('textarea');ta.className='t';ta.style.height='180px';ta.value=txt;t.parentElement.appendChild(ta);ta.select();toast('Selecione e copie manualmente')}return}
if(t.id==='baixaBackup'){try{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='painel-saude-v3-'+hoje()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200);toast('Backup gerado')}catch(err){toast('Use Copiar backup')}return}
if(t.id==='importar'){mostrarImport=!mostrarImport;if(!mostrarImport)textoImport='';confirmar=null;render();return}if(t.id==='aplicaImport'||t.id==='fundeImport'){const campo=$('#areaImport');if(campo)textoImport=campo.value;let o;try{o=normalizeState(JSON.parse((textoImport||'').trim()))}catch(err){toast('Backup inválido');return}const before=JSON.stringify(S);if(t.id==='aplicaImport'){if((S.sessoes.length||S.medidas.length)&&confirmar!=='import'){confirmar='import';render();toast('Toque novamente para confirmar');return}S=o}else{const ids=new Set(S.sessoes.map(s=>s.id)),fps=new Set(S.sessoes.map(fingerprintSessao));o.sessoes.forEach(s=>{const fp=fingerprintSessao(s);if(!ids.has(s.id)&&!fps.has(fp)){S.sessoes.push(s);ids.add(s.id);fps.add(fp)}});const im=new Set(S.medidas.map(m=>m.id)),fm=new Set(S.medidas.map(fingerprintMedida));o.medidas.forEach(m=>{const fp=fingerprintMedida(m);if(im.has(m.id)||fm.has(fp))return;const same=S.medidas.find(x=>x.data===m.data);if(same){for(const k of ['peso','cintura','braco','coxa','fcRep','vo2','sono'])if(same[k]===null&&m[k]!==null)same[k]=m[k]}else S.medidas.push(m);im.add(m.id);fm.add(fp)});S.sessoes.sort((a,b)=>a.data.localeCompare(b.data)||(a.criadoEm||'').localeCompare(b.criadoEm||''));S.medidas.sort((a,b)=>a.data.localeCompare(b.data))}if(!await persistir()){S=normalizeState(JSON.parse(before));render();toast('Falha ao gravar o backup importado');return}mostrarImport=false;textoImport='';confirmar=null;render();toast(S.sessoes.length+' sessões carregadas');return}
if(t.closest('[data-cancelar]')){confirmar=null;render();return}const ds=t.closest('[data-delses]');if(ds){const i=+ds.dataset.delses,k='ses:'+i;if(confirmar!==k){confirmar=k;render();return}const before=JSON.stringify(S);S.sessoes.splice(i,1);confirmar=null;if(!await persistir()){S=normalizeState(JSON.parse(before));render();toast('Falha ao apagar');return}render();toast('Sessão apagada');return}const dm=t.closest('[data-delmed]');if(dm){const i=+dm.dataset.delmed,k='med:'+i;if(confirmar!==k){confirmar=k;render();return}const before=JSON.stringify(S);S.medidas.splice(i,1);confirmar=null;if(!await persistir()){S=normalizeState(JSON.parse(before));render();toast('Falha ao apagar');return}render();toast('Medida apagada');return}if(t.id==='apagarTudo'){if(confirmar!=='tudo'){confirmar='tudo';render();return}S=normalizeState({sessoes:[],medidas:[],criado:hoje()});confirmar=null;await persistir();rascunho=null;limparDraft();aba='hoje';render(true);toast('Painel zerado');return}});
document.addEventListener('input',e=>{const t=e.target;if(confirmar&&String(confirmar).startsWith('dup:'))confirmar=null;if(t.id==='areaImport'){textoImport=t.value;return}if(aba!=='registrar'||!rascunho)return;const ex=t.closest('[data-ex]');if(ex&&t.dataset.k){const d=rascunho.exercicios.find(x=>x.id===ex.dataset.ex);d.series[+t.dataset.i][t.dataset.k]=t.value.replace(',','.')}if(t.dataset.c)rascunho.cardio[t.dataset.c]=t.value.replace(',','.');if(t.id==='notas')rascunho.notas=t.value;if(t.id==='dataSes')rascunho.data=t.value;if(t.id==='progOk')rascunho.progressaoOk=t.checked;salvarDraft()});document.addEventListener('change',e=>{if(e.target.id==='progOk'&&rascunho){rascunho.progressaoOk=e.target.checked;salvarDraft()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&rascunho)salvarDraft(true)});window.addEventListener('pagehide',()=>{if(rascunho)salvarDraft(true)});
(async()=>{await initStore();await carregar();render();if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}})();
</script>
